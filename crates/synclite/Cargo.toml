[package]
name = "synclite-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Top-level facade that wires a SyncLite device, shipper, and archivers from a single config file."
include = [
    "src/**/*",
    "build.rs",
    "native/libsynclitecdc_x86_64.so",
    "native/libsynclitecdc_x86.so",
    "native/synclitecdc_x86_64.dll",
    "native/synclitecdc_x86.dll",
    "Cargo.toml",
    "README.md",
]

[lib]
name = "synclite"

[features]
default = []
# Kept as a compatibility alias; DuckDB is part of every default build.
duckdb = ["consolidator-runtime/duckdb"]
# Enable the S3 archiver via logger-archiver's matching feature.
s3 = ["logger-archiver/s3"]
# Enable the SFTP archiver via logger-archiver's matching feature.
sftp = ["logger-archiver/sftp"]

[dependencies]
logger-core.workspace = true
logger-config.workspace = true
logger-db-traits.workspace = true
logger-db-sqlite.workspace = true
logger-db-duckdb.workspace = true
logger-archiver.workspace = true
logger-shipper.workspace = true
consolidator-core.workspace = true
consolidator-runtime.workspace = true
consolidator-state.workspace = true
tracing.workspace = true
synclite-observability.workspace = true
rusqlite.workspace = true
duckdb.workspace = true
postgres.workspace = true
uuid.workspace = true
fs2.workspace = true

# DuckDB publishes no prebuilt Android shared library, so Android targets
# compile the bundled DuckDB sources into the JNI library (no libduckdb.so
# sidecar). Desktop targets keep using the downloaded prebuilt library.
[target.'cfg(target_os = "android")'.dependencies]
duckdb = { workspace = true, features = ["bundled"] }

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["time", "net"] }
tokio-postgres = "0.7"
# status.rs test module compiles consolidator-state's sources in-crate, so it
# needs the same TLS dependencies as that crate.
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
webpki-roots = "1"


