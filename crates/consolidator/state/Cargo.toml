[package]
name = "consolidator-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Consolidator state, checkpoint, and bootstrap helpers."

[lib]
name = "consolidator_state"

[features]
default = []
# Kept as a compatibility alias; DuckDB is always compiled in.
duckdb = []

[dependencies]
consolidator-core.workspace = true
logger-core.workspace = true
rusqlite.workspace = true
duckdb.workspace = true
postgres.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time", "net"] }
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
rustls-pemfile = "2"
webpki-roots = "1"

[dev-dependencies]
tempfile.workspace = true


