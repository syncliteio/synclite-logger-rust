[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "synclite"
version = "1.2.0"
description = "Python bindings for the SyncLite Rust runtime (logger + embedded consolidator)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "SyncLite contributors" }]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
sqlalchemy = ["SQLAlchemy>=2.0,<3"]
sqlalchemy-duckdb = ["SQLAlchemy>=2.0,<3", "duckdb-engine>=0.17,<0.18"]
test = ["pytest>=7", "SQLAlchemy>=2.0,<3", "duckdb-engine>=0.17,<0.18"]

[project.entry-points."sqlalchemy.dialects"]
"sqlite.synclite" = "synclite.sqlalchemy.sqlite:SQLiteDialect_syncLite"
"duckdb.synclite" = "synclite.sqlalchemy.duckdb:DuckDBDialect_syncLite"

[project.urls]
Homepage = "https://www.synclite.io"
Repository = "https://github.com/synclite/synclite"

[tool.maturin]
manifest-path = "../crates/logger/bindings-python/Cargo.toml"
module-name = "synclite._native"
python-source = "src"
features = []
strip = true
